[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-monitor-dashboard"
version = "1.0.0"
description = "AI-powered operations monitoring dashboard"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.104.0", "uvicorn[standard]>=0.24.0", "psutil>=5.9.0", "httpx>=0.25.0"]

[tool.setuptools.packages.find]
include = ["app*"]
