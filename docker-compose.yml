version: "3.8"
services:
  backend:
    build: .
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - DIAGNOSIS_TIMEOUT=300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/api/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
